<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Form | Mother's Pride</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-yellow: #FFD166;
            --secondary-orange: #FF9F1C;
            --accent-blue: #4EA8DE;
            --accent-pink: #FF99C8;
            --accent-red: #FF4B4B;
            --dark-navy: #111827;
            --light-bg: #FAFAFA;
            --white: #FFFFFF;
            --text-muted: #6B7280;
            --transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Outfit', sans-serif; background-color: var(--light-bg); color: var(--dark-navy); overflow-x: hidden; line-height: 1.4; font-size: 0.9rem; }
        
        .container { max-width: 800px; margin: 0 auto; padding: 0 5%; }

        /* --- Header --- */
        header.glass-header { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 1200px; z-index: 1010; }
        .header-inner { display: flex; justify-content: space-between; align-items: center; padding: 8px 25px; border-radius: 50px; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15); }
        .logo-img { height: 30px; cursor: pointer; }
        .hamburger { background: transparent; border: none; cursor: pointer; display: flex; flex-direction: column; gap: 5px; }
        .hamburger .bar { width: 25px; height: 3px; background: var(--dark-navy); border-radius: 3px; transition: var(--transition); }

        /* --- Menu Overlay --- */
        .menu-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--primary-yellow); z-index: 1009; display: flex; flex-direction: column; justify-content: center; padding: 0 10%; clip-path: circle(0% at 100% 0%); transition: clip-path 0.8s cubic-bezier(0.77, 0, 0.175, 1); }
        .menu-overlay.active { clip-path: circle(150% at 100% 0%); }
        .menu-item { font-size: clamp(2rem, 4vw, 3.5rem); font-weight: 900; text-decoration: none; color: var(--dark-navy); display: block; margin-bottom: 15px; transform: translateY(25px); opacity: 0; transition: var(--transition); }
        .menu-overlay.active .menu-item { transform: translateY(0); opacity: 1; }
        .menu-item:hover { color: var(--white); padding-left: 20px; }
        .menu-num { font-size: 0.9rem; font-weight: 500; vertical-align: middle; margin-right: 12px; }

        /* --- Doodle Art Background --- */
        .bg-doodles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; opacity: 0.5; }

        /* --- Form Page Hero --- */
        .form-hero { padding: 140px 0 40px; text-align: center; }
        .form-hero h1 { font-size: 2.8rem; margin-bottom: 10px; }
        .form-hero p { color: var(--text-muted); max-width: 500px; margin: 0 auto; font-weight: 500; }

        /* --- Artistic Form Container --- */
        .form-canvas { 
            background: white; 
            padding: 40px; 
            border-radius: 30px; 
            border: 2px solid #E5E7EB; 
            position: relative; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            margin-bottom: 80px;
        }
        
        /* Washi Tape Doodles */
        .form-canvas::before { 
            content: ''; position: absolute; top: -12px; left: 50%; transform: translateX(-50%) rotate(1deg); 
            width: 80px; height: 30px; background: rgba(78, 168, 222, 0.3); z-index: 2; 
        }
        .form-canvas::after { 
            content: ''; position: absolute; bottom: -15px; right: 20px; 
            width: 60px; height: 60px; background: url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279-7.416-3.967-7.417 3.967 1.481-8.279-6.064-5.828 8.332-1.151z' fill='%23FFD166'/%3E%3C/svg%3E");
            background-size: contain; background-repeat: no-repeat; opacity: 0.8;
        }

        .form-group { margin-bottom: 20px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        label { display: block; font-weight: 800; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; color: var(--dark-navy); }
        
        input, select, textarea { 
            width: 100%; padding: 14px 18px; border-radius: 12px; border: 2px dashed var(--border-color); 
            background: var(--light-bg); font-family: 'Outfit', sans-serif; font-size: 0.95rem; 
            color: var(--dark-navy); outline: none; transition: 0.3s;
        }
        
        input:focus, textarea:focus { border: 2px solid var(--primary-yellow); background: white; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 209, 102, 0.1); }

        .btn-submit { 
            width: 100%; padding: 18px; border-radius: 15px; background: var(--dark-navy); 
            color: white; font-weight: 800; border: none; cursor: pointer; 
            font-size: 1rem; transition: 0.3s; margin-top: 10px;
        }
        .btn-submit:hover { background: var(--accent-red); transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255, 75, 75, 0.2); }

        /* Floating Doodle Elements */
        .doodle-star { position: absolute; width: 40px; top: 10%; right: 10%; opacity: 0.3; }

        @media (max-width: 650px) {
            .form-row { grid-template-columns: 1fr; gap: 0; }
            .form-canvas { padding: 30px 20px; border-radius: 20px; }
            .form-hero h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="glass-header">
        <div class="header-inner">
            <a href="index.html" class="logo"><img src="logo1.png" alt="Logo" class="logo-img"></a>
            <button class="hamburger" id="menu-toggle"><div class="bar"></div><div class="bar"></div></button>
        </div>
    </header>

    <!-- Menu Overlay -->
    <div class="menu-overlay">
        <div class="menu-content">
            <a href="index.html" class="menu-item"><span class="menu-num">00</span> Home</a>
            <a href="index.html#notice" class="menu-item"><span class="menu-num">01</span> Notice</a>
            <a href="#" class="menu-item close-overlay"><span class="menu-num">02</span> Admission Form</a>
            <a href="about.html" class="menu-item"><span class="menu-num">03</span> About Us</a>
            <a href="index.html#activities" class="menu-item"><span class="menu-num">04</span> Activities</a>
            <a href="success.html" class="menu-item"><span class="menu-num">05</span> Student Success</a>
        </div>
    </div>

    <!-- Artistic Background Doodles -->
    <svg class="bg-doodles" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 300 Q 100 250 150 300 T 250 300" fill="none" stroke="#FF99C8" stroke-width="3" stroke-dasharray="8 8"/>
        <circle cx="800" cy="100" r="25" fill="none" stroke="#4EA8DE" stroke-width="2"/>
        <path d="M50 850 L 120 850" fill="none" stroke="#FFD166" stroke-width="5" stroke-linecap="round"/>
    </svg>

    <div class="form-hero">
        <div class="container">
            <h1>Join the <span style="color: var(--accent-red);">Family.</span></h1>
            <p>Fill out the details below to begin your child's journey with Srinagar's most loved creche.</p>
        </div>
    </div>

    <div class="container">
        <div class="form-canvas">
            <!-- Formspree Integration -->
            <form action="https://formspree.io/f/xlgzzqdn" method="POST">
                
                <!-- Redirect to success.html after submission -->
                <input type="hidden" name="_next" value="success.html">

                <div class="form-row">
                    <div class="form-group">
                        <label>Child's Full Name</label>
                        <input type="text" name="Child Name" placeholder="Little one's name" required>
                    </div>
                    <div class="form-group">
                        <label>Child's Age</label>
                        <input type="number" name="Age" placeholder="e.g. 3" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Parent / Guardian Name</label>
                    <input type="text" name="Parent Name" placeholder="Your full name" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Contact Number</label>
                        <input type="tel" name="Phone" placeholder="+91" required>
                    </div>
                    <div class="form-group">
                        <label>Current Location</label>
                        <input type="text" name="Location" placeholder="e.g. Lal Bazar, Srinagar" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Additional Notes</label>
                    <textarea name="Message" placeholder="Any specific requirements or medical info?"></textarea>
                </div>

                <button type="submit" class="btn-submit">Submit Application</button>

            </form>
        </div>
    </div>

    <footer style="text-align: center; padding: 40px 0; background: var(--dark-navy); color: rgba(255,255,255,0.3); font-size: 0.75rem;">
        &copy; 2026 Mother's Pride Srinagar. Secure Admission 2026.
    </footer>

    <script>
        // Hamburger Menu Logic
        const menuToggle = document.getElementById('menu-toggle');
        const menuOverlay = document.querySelector('.menu-overlay');
        function toggleMenu() {
            menuOverlay.classList.toggle('active');
            const bars = menuToggle.querySelectorAll('.bar');
            if (menuOverlay.classList.contains('active')) {
                bars[0].style.transform = 'translateY(4px) rotate(45deg)';
                bars[1].style.transform = 'translateY(-4px) rotate(-45deg)';
            } else {
                bars[0].style.transform = 'none';
                bars[1].style.transform = 'none';
            }
        }
        menuToggle.addEventListener('click', toggleMenu);
        document.querySelector('.close-overlay').addEventListener('click', toggleMenu);
    </script>
</body>
</html>
